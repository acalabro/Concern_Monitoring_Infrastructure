version: '3.8'

services:
  # Database MySQL
  mysql:
    image: mysql:8.0
    container_name: concern-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: eventdb
      MYSQL_USER: concern
      MYSQL_PASSWORD: concern123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - concern-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Concern Monitoring Backend
  concern-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: concern-backend
    ports:
      - "8181:8181"
      - "61616:61616"  # ActiveMQ
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=eventdb
      - MYSQL_USER=concern
      - MYSQL_PASSWORD=concern123
      - ACTIVEMQ_URL=tcp://0.0.0.0:61616
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - concern-network
    volumes:
      - ./logs:/app/logs
      - ./src/main/resources/rules:/app/rules

  # Frontend Dashboard (Nginx)
  frontend:
    image: nginx:alpine
    container_name: concern-frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - concern-backend
    networks:
      - concern-network

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: concern-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-clock-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - mysql
    networks:
      - concern-network

  # Prometheus (per metriche sistema)
  prometheus:
    image: prom/prometheus:latest
    container_name: concern-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - concern-network

networks:
  concern-network:
    driver: bridge

volumes:
  mysql-data:
  grafana-data:
  prometheus-data:
