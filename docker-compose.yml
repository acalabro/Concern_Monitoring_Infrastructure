version: '3.8'

services:

  # ── Database MySQL ─────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: concern-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE:      eventdb
      MYSQL_USER:          concern
      MYSQL_PASSWORD:      "un53cur3!!"
    ports:
      - "3306:3306"
    volumes:
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    networks:
      - concern-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "concern", "-pun53cur3!!"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Backend Java ───────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: concern-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # "mysql" è il nome del service sopra — raggiungibile sulla concern-network
      MYSQL_HOST:     mysql
      MYSQL_PORT:     3306
      MYSQL_DATABASE: eventdb
      MYSQL_USER:     concern
      MYSQL_PASSWORD: "un53cur3!!"
      JAVA_OPTS:      "-Xmx2g -Xms512m"
    ports:
      - "8181:8181"   # REST API
      - "61616:61616" # ActiveMQ (broker embedded)
    networks:
      - concern-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Frontend React + Nginx ─────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: concern-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - concern-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  concern-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
